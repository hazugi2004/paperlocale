name: Upstream layout compatibility

on:
  # 每周安装允许范围内的最新 pdf2zh-next，并用自有合成 PDF 验证真实 CLI 接口。
  # 手动入口用于上游发版后立即复核，无需等待下一次定时运行。
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-layout-compatibility
  cancel-in-progress: false

jobs:
  layout-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Install current layout integration
        run: python -m pip install -e ".[layout,test]"

      - name: Run real two-pass layout smoke test
        run: >-
          python scripts/layout_smoke.py
          --output tmp/upstream-compatibility
          --demo-gif tmp/upstream-compatibility/demo.gif

      # 无论成功或失败都保留已经产生的日志，便于判断是上游接口变化还是环境故障。
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-layout-compatibility
          path: |
            tmp/upstream-compatibility/demo.gif
            tmp/upstream-compatibility/run/logs/
            tmp/upstream-compatibility/run/qa/
            tmp/upstream-compatibility/run/run_manifest.json
          if-no-files-found: warn
          retention-days: 14
