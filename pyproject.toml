[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlocale"
version = "0.3.4"
description = "Verified, layout-preserving academic PDF translation with pluggable providers and domain packs."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "PaperLocale contributors" }]
dependencies = [
  "fonttools>=4.55",
  "Pillow>=10",
  # pdf2zh-next 2.9.x 当前要求 PyMuPDF<1.25.3；1.25.2 已通过真实两阶段版面测试。
  "PyMuPDF>=1.25.2,<1.25.3",
  "pypdf>=6",
]
keywords = [
  "academic-pdf",
  "pdf-translation",
  "babeldoc",
  "codex",
  "scientific-translation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
paperlocale = "paperlocale.cli:main"

[project.optional-dependencies]
test = ["reportlab>=4"]
layout = ["pdf2zh-next>=2.9,<3"]

[project.urls]
Repository = "https://github.com/hazugi2004/paperlocale"
Issues = "https://github.com/hazugi2004/paperlocale/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperlocale = ["packs/*/*"]
