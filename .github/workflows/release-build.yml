name: release-build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-app:
    needs: build-distributions
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: paperlocale-${{ github.ref_name }}
          path: release-distributions
      - name: Build and install the exact tagged macOS bundle
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          domain_version="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("src/paperlocale/packs/atmospheric-science/manifest.json").read_text())["version"])')"
          wheel_name="paperlocale-${expected_version}-py3-none-any.whl"
          python -m pip install "Pillow>=10"
          python scripts/build_macos_app.py --wheel "release-distributions/$wheel_name"
          extracted="$(mktemp -d)"
          ditto -x -k "dist/PaperLocale-$expected_version-macOS-universal2.zip" "$extracted"
          # 校验对外下载的 ZIP，而非构建目录里的中间文件。
          cmp "release-distributions/$wheel_name" "$extracted/$wheel_name"
          app="$extracted/PaperLocale.app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/PaperLocale"
          "$app/Contents/MacOS/PaperLocale" --version | grep -Fx "PaperLocale macOS $expected_version"
          # 给安装脚本空的家目录，防止验证意外借用预装 CLI 或缓存环境。
          install_home="$(mktemp -d)"
          HOME="$install_home" "$extracted/Install PaperLocale CLI.command"
          cli="$install_home/Library/Application Support/PaperLocale/cli/$expected_version/bin/paperlocale"
          "$cli" --version | grep -Fx "paperlocale $expected_version"
          "$cli" domain-check atmospheric-science | grep -F "atmospheric-science $domain_version，"
          # Foundation 可以规范化 /private/var，比较实际文件身份以核对 App 绑定。
          app_cli="$(HOME="$install_home" CFFIXED_USER_HOME="$install_home" "$app/Contents/MacOS/PaperLocale" --cli-path)"
          test "$app_cli" -ef "$cli"
          "$app_cli" domain-check atmospheric-science | grep -F "atmospheric-science $domain_version，"
      - uses: actions/upload-artifact@v7
        with:
          name: paperlocale-macos-${{ github.ref_name }}
          path: dist/PaperLocale-*-macOS-universal2.zip
          if-no-files-found: error
          retention-days: 30

  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # 构建任务不需要向仓库写入，避免把临时令牌保留在 Git 配置中。
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install release tools
        run: python -m pip install "build==1.5.0" "twine==7.0.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install the exact built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          expected_version="${GITHUB_REF_NAME#v}"
          EXPECTED_VERSION="$expected_version" python -c 'import importlib.metadata, os, paperlocale; expected = os.environ["EXPECTED_VERSION"]; assert importlib.metadata.version("paperlocale") == paperlocale.__version__ == expected'
          paperlocale --version | grep -Fx "paperlocale $expected_version"
          domain_version="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("src/paperlocale/packs/atmospheric-science/manifest.json").read_text())["version"])')"
          paperlocale domain-check atmospheric-science | grep -F "atmospheric-science $domain_version，"
      - name: Resolve layout extra from the exact built wheel
        run: |
          # 从标签实际构建的 wheel 读取 extra 元数据，避免只验证源码目录而漏掉
          # 发布附件中的依赖冲突。这里只做完整求解，真实 CLI 另由兼容性工作流执行。
          wheel_path=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          test -n "$wheel_path"
          python -m pip install --dry-run "${wheel_path}[layout]"
      - name: Preserve reviewed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paperlocale-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
