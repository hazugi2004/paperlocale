name: New domain pack
description: 提议或贡献新的专业术语包
title: "[Domain pack] "
labels: ["domain-pack", "help-wanted"]
body:
  - type: input
    id: domain
    attributes:
      label: 学科与翻译方向
      placeholder: ecology, en -> zh-CN
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 术语范围与不包含内容
      description: 说明子领域、适用语境和容易混淆的概念。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 术语依据
      description: 可列公开标准、权威词表或专业审校说明，不要复制受版权限制的全文。
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我会提供 manifest、prompt、glossary 和 eval_cases 四个文件
          required: true
        - label: 我不会提交论文全文、密钥或私人数据
          required: true
